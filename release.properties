########################################
# Android
########################################

MIN_SDK=26
TARGET_SDK=37
COMPILE_SDK=37

########################################
# Product Families
########################################

# The leading digit of versionCode. It keeps sibling apps in separate ranges,
# so it changes per product, never per release.
PHONE_PRODUCT_FAMILY=1

########################################
# Play Upload Counter
########################################

# Build number within the current release month, 1..99.
#
# Reset to 1 for the first Play upload of a new month; increment it only when a
# second build goes out in the same month. build-logic derives everything else
# from the build date, so this is the only value a release edits by hand.
#
#   versionName = YY.MM.BB
#   versionCode = FSSYYMMBB
#                 │ │  │  └─ upload (this value)
#                 │ │  └──── year and month, from the build date
#                 │ └─────── TARGET_SDK
#                 └───────── PHONE_PRODUCT_FAMILY
#
# Examples with PHONE_PRODUCT_FAMILY=1 and TARGET_SDK=37:
#
#   August 2026,    PHONE_UPLOAD=17 -> 26.08.17 / 137260817
#   September 2026, PHONE_UPLOAD=1  -> 26.09.01 / 137260901
#   October 2026,   PHONE_UPLOAD=1  -> 26.10.01 / 137261001
#   January 2027,   PHONE_UPLOAD=1  -> 27.01.01 / 137270101
#
# Play requires each upload to exceed the last, so never lower TARGET_SDK after
# a release: the SDK digits outrank the date and a smaller code would be
# rejected.
PHONE_UPLOAD=18