# Lower heap to 4GB for 16GB RAM systems to avoid swapping
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Disable parallel mode and configuration cache to fix "Unable to make progress running work" deadlock in Gradle 9.x
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Artifact identifiers used for library publishing and JitPack integration.
PUBLISHING_ARTIFACT_ID=apptoolkit
PUBLISHING_VERSION=3.0.0
JITPACK_GROUP_ID=com.github.MihaiCristianCondrea.App-Toolkit-for-Android
