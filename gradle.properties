# Give large Android builds more heap while keeping enough RAM for the IDE and OS.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Limit concurrent Gradle work to avoid several memory-heavy Android tasks
# consuming RAM at the same time.
org.gradle.workers.max=2

# Disabled because of the Gradle 9.x progress/deadlock issue in this project.
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Artifact identifiers used for library publishing and JitPack integration.
PUBLISHING_ARTIFACT_ID=apptoolkit
PUBLISHING_VERSION=3.0.0-pre23
JITPACK_GROUP_ID=com.github.MihaiCristianCondrea.App-Toolkit-for-Android
