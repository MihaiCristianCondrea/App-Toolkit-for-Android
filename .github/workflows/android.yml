name: Android CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install the declared Android platform
        shell: bash
        run: |
          sdk_version=$(sed -n 's/^COMPILE_SDK=//p' release.properties | tr -d '\r')
          sdk_minor=$(sed -n 's/^COMPILE_SDK_MINOR=//p' release.properties | tr -d '\r')
          if [ "$sdk_minor" != "0" ]; then sdk_version="$sdk_version.$sdk_minor"; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$sdk_version"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android and run unit tests, boundaries and lint
        run: ./gradlew --no-daemon --stacktrace :sample:app:assembleDebug testDebugUnitTest checkModuleBoundaries lintDebug

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results*
          if-no-files-found: ignore
  marketing-ui:
    name: Marketing UI and store validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marketing/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: marketing/ui/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Prepare assets and build the UI kit
        run: npm run build
      - name: Run browser checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run qa
      - name: Validate the store listings
        run: node ../creative/store/google-play/scripts/validate.mjs
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-ui-captures
          path: marketing/ui/captures/
          if-no-files-found: ignore
