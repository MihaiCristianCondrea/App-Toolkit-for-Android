name: "CodeQL Analysis"

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  analyze:
    # Automatic advanced analysis is opt-in while CodeQL catches up with Kotlin.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_ADVANCED_CODEQL == 'true' }}
    name: Analyze
    runs-on: ubuntu-latest

    # App Toolkit intentionally tracks the newest stable Kotlin and Android
    # toolchain versions. CodeQL may temporarily lag behind new Kotlin compiler
    # releases, so CodeQL/tooling incompatibilities must not block project CI.
    continue-on-error: true

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"