// Classes the Compose compiler cannot infer stability for, because they come from dependencies that
// were not compiled with the Compose compiler.
//
// com.google.android.libraries.ads.mobile.sdk.nativead.NativeAd
//   A handle to an ad the Mobile Ads SDK owns. The renderer re-binds it inside AndroidView's
//   `update` on every recomposition, so binding the same instance twice is a no-op, treating
//   instance identity as "unchanged" is exactly the semantics Compose stability asks for. Without
//   this entry the compiler marks the parameter runtime-determined and every ad slot recomposes
//   unconditionally.
com.google.android.libraries.ads.mobile.sdk.nativead.NativeAd
